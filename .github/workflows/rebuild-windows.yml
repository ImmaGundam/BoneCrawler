name: Rebuild Windows v2.9.6

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild-windows-v2.9.6
    paths:
      - '.github/workflows/rebuild-windows.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-windows.yml'

permissions:
  contents: read

jobs:
  windows-rebuild:
    runs-on: windows-latest

    steps:
      - name: Checkout repository and build history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore launcher build source
        shell: pwsh
        run: |
          git checkout v2.9.5 -- tools/java
          if (-not (Test-Path -LiteralPath tools/java/bc-launcher/scripts/package-windows.ps1)) {
            throw "Launcher build source was not restored from v2.9.5."
          }

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build fresh Windows app image
        shell: pwsh
        run: >
          ./tools/java/bc-launcher/scripts/package-windows.ps1
          -ProjectRoot "${{ github.workspace }}"
          -JdkHome "$env:JAVA_HOME"
          -AppVersion "2.9.6"

      - name: Verify rebuilt launcher and JVM
        shell: pwsh
        run: |
          $image = Join-Path $env:GITHUB_WORKSPACE "dist/native/BoneCrawler"
          $launcher = Join-Path $image "BoneCrawler.exe"
          $java = Join-Path $image "runtime/bin/java.exe"
          $jvm = Join-Path $image "runtime/bin/server/jvm.dll"
          $modules = Join-Path $image "runtime/lib/modules"

          foreach ($required in @($launcher, $java, $jvm, $modules)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Missing rebuilt runtime file: $required"
            }
          }

          & $java -version
          if ($LASTEXITCODE -ne 0) {
            throw "The rebuilt Java runtime failed its startup check."
          }

          $env:JPACKAGE_DEBUG = "true"
          $stdout = Join-Path $env:GITHUB_WORKSPACE "dist/launcher.stdout.log"
          $stderr = Join-Path $env:GITHUB_WORKSPACE "dist/launcher.stderr.log"
          $process = Start-Process -FilePath $launcher `
            -ArgumentList "--headless", "--no-open", "--port", "48996" `
            -WorkingDirectory $image `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "BoneCrawler.exe exited during its JVM startup check with code $($process.ExitCode)."
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:48996/index.html" `
                  -SkipHttpErrorCheck `
                  -TimeoutSec 2
                if ($response.StatusCode -eq 403) {
                  $ready = $true
                  break
                }
              } catch {
              }
            }
            if (-not $ready) {
              throw "BoneCrawler.exe stayed open but its Java launcher server did not start."
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
            Get-Content -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
          }

          $moduleSize = (Get-Item -LiteralPath $modules).Length
          if ($moduleSize -lt 100MB) {
            throw "The rebuilt Java modules image is unexpectedly small: $moduleSize bytes"
          }

          Get-FileHash -Algorithm SHA256 -LiteralPath $launcher, $java, $jvm, $modules |
            Format-Table -AutoSize

      - name: Archive verified Windows image
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist/BoneCrawler-v2-9-6_fix.zip"
          Compress-Archive -Path dist/native/BoneCrawler/* -DestinationPath $archive -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $required = @(
              "BoneCrawler.exe",
              "app/BoneCrawler.cfg",
              "runtime/bin/java.exe",
              "runtime/bin/server/jvm.dll",
              "runtime/lib/modules"
            )
            $entries = @{}
            foreach ($entry in $zip.Entries) {
              $entries[$entry.FullName.Replace('\', '/')] = $entry.Length
            }
            foreach ($path in $required) {
              if (-not $entries.ContainsKey($path)) {
                throw "Archive is missing required entry: $path"
              }
            }
            if ($entries["runtime/lib/modules"] -lt 100MB) {
              throw "Archived Java modules image is truncated."
            }
          } finally {
            $zip.Dispose()
          }

          Get-FileHash -Algorithm SHA256 -LiteralPath $archive | Format-Table -AutoSize

      - name: Verify extracted archive bytes
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "dist/native/BoneCrawler"
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist/BoneCrawler-v2-9-6_fix.zip"
          $extracted = Join-Path $env:GITHUB_WORKSPACE "dist/archive-check"
          Remove-Item -LiteralPath $extracted -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force

          $protected = @(
            "BoneCrawler.exe",
            "app/BoneCrawler.cfg",
            "runtime/bin/java.exe",
            "runtime/bin/server/jvm.dll",
            "runtime/lib/modules"
          )
          foreach ($relativePath in $protected) {
            $sourcePath = Join-Path $source $relativePath
            $extractedPath = Join-Path $extracted $relativePath
            $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash
            $extractedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $extractedPath).Hash
            if ($sourceHash -ne $extractedHash) {
              throw "Archive extraction changed protected file: $relativePath"
            }
          }

          & (Join-Path $extracted "runtime/bin/java.exe") -version
          if ($LASTEXITCODE -ne 0) {
            throw "The Java runtime failed after archive extraction."
          }

          $launcher = Join-Path $extracted "BoneCrawler.exe"
          $stdout = Join-Path $env:GITHUB_WORKSPACE "dist/extracted-launcher.stdout.log"
          $stderr = Join-Path $env:GITHUB_WORKSPACE "dist/extracted-launcher.stderr.log"
          $process = Start-Process -FilePath $launcher `
            -ArgumentList "--headless", "--no-open", "--port", "48997" `
            -WorkingDirectory $extracted `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "The extracted BoneCrawler.exe exited during its JVM startup check with code $($process.ExitCode)."
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:48997/index.html" `
                  -SkipHttpErrorCheck `
                  -TimeoutSec 2
                if ($response.StatusCode -eq 403) {
                  $ready = $true
                  break
                }
              } catch {
              }
            }
            if (-not $ready) {
              throw "The extracted BoneCrawler.exe stayed open but its Java launcher server did not start."
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
            Get-Content -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
          }

      - name: Upload verified Windows image
        uses: actions/upload-artifact@v4
        with:
          name: BoneCrawler-v2-9-6_fix
          path: dist/BoneCrawler-v2-9-6_fix.zip
          if-no-files-found: error
          retention-days: 14
