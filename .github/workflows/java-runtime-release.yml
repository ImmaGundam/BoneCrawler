name: Release Java Runtime

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish, for example v2.9.5'
        required: true

permissions:
  contents: write

jobs:
  windows-java-runtime-release:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No release tag was provided."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Build Java runtime package
        shell: pwsh
        run: >
          ./tools/java/bc-launcher/scripts/package-windows.ps1
          -ProjectRoot "${{ github.workspace }}"
          -JdkHome "$env:JAVA_HOME"

      - name: Archive Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path dist/native/BoneCrawler/* -DestinationPath dist/BoneCrawler-java-windows-${{ steps.release_tag.outputs.tag }}.zip -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: dist/BoneCrawler-java-windows-${{ steps.release_tag.outputs.tag }}.zip
