name: Build Java Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/java-runtime-build.yml'
      - 'index.html'
      - 'assets/**'
      - 'dev/**'
      - 'docs/**'
      - 'packages/**'
      - 'src/**'
      - 'tools/java/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/java-runtime-build.yml'
      - 'index.html'
      - 'assets/**'
      - 'dev/**'
      - 'docs/**'
      - 'packages/**'
      - 'src/**'
      - 'tools/java/**'

jobs:
  windows-java-runtime:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Build Java runtime package
        shell: pwsh
        run: >
          ./tools/java/bc-launcher/scripts/package-windows.ps1
          -ProjectRoot "${{ github.workspace }}"
          -JdkHome "$env:JAVA_HOME"

      - name: Archive Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path dist/native/BoneCrawler/* -DestinationPath dist/BoneCrawler-java-windows.zip -Force

      - name: Upload Java runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoneCrawler-java-runtime-windows
          path: dist/BoneCrawler-java-windows.zip
          if-no-files-found: error
          retention-days: 14
